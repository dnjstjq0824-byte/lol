# Render backend deploy config: Go API + Postgres + Redis.
# Usage: Render dashboard > New > Blueprint > connect this repo.
# Then set RIOT_API_KEY / ADMIN_PASSWORD / GOOGLE_* in the dashboard.
services:
  - type: web
    name: riftstats-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/monitoring/health
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: GOVERNOR_MODE
        value: DEV_PROTOTYPE_MODE
      - key: DATABASE_URL
        fromDatabase:
          name: riftstats-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: riftstats-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://lol.dnjstjqppk.workers.dev
      - key: CORS_ALLOWED_ORIGINS
        value: https://lol.dnjstjqppk.workers.dev
      - key: RIOT_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: riftstats-db
    plan: starter
    databaseName: riftstats
    user: riftstats

servicesRedis:
  - name: riftstats-redis
    plan: starter
