name: CI - BN RiftStats Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Go Backend Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Tests
        run: go test -v -race ./...

  frontend-e2e:
    name: Playwright 11-Viewport E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Install Dependencies
        run: |
          pnpm install
          pnpm approve-builds --all

      - name: Build Web Bundle
        run: cd web && pnpm exec vite build

      - name: Install Playwright Browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium

      - name: Build and Start Go API Server
        run: |
          go build -o bin/api ./cmd/api
          ./bin/api &
          sleep 3

      - name: Run Playwright Tests
        run: cd e2e && pnpm exec playwright test

